name: Patch live VET Evidence social preview
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_live_text_only_social.py'
      - '.github/workflows/patch-live-text-social.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/patch_live_text_only_social.py
      - name: Commit text-only social metadata
        run: |
          git config user.name "BHOC Social Metadata"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use text-only VET Evidence social preview"
          git pull --rebase --autostash origin main
          git push origin main
