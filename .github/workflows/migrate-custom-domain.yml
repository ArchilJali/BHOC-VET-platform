name: Stage Vet Evidence custom domain
on:
  push:
    branches: ['preview/vet-evidence-custom-domain-20260912']
    paths:
      - 'scripts/migrate_custom_domain.py'
      - '.github/workflows/migrate-custom-domain.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/migrate_custom_domain.py
      - name: Commit staged migration
        run: |
          git config user.name "BHOC Domain Migration"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage evidence.bhocvet.com metadata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
